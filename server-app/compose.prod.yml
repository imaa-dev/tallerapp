x-logging:
  &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:

  # ==========================================================
  # Laravel PHP-FPM
  # ==========================================================

  app:
    image: tallerapp-app:${APP_VERSION}

    build:
      context: .
      dockerfile: Dockerfile
      target: app
      args:
        VITE_APP_NAME: ${VITE_APP_NAME}
        VITE_APP_URL: ${VITE_APP_URL}

    container_name: tallerapp-app

    restart: unless-stopped

    working_dir: /var/www/html

    env_file:
      - .env

    volumes:
      - storage:/var/www/html/storage

    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s

    logging: *default-logging

    depends_on:
      mysql:
        condition: service_healthy

      redis:
        condition: service_healthy

    networks:
      - tallerapp


  # ==========================================================
  # Nginx
  # ==========================================================

  nginx:
    image: tallerapp-nginx:${APP_VERSION}

    build:
      context: .
      dockerfile: Dockerfile
      target: nginx
      args:
        VITE_APP_NAME: ${VITE_APP_NAME}
        VITE_APP_URL: ${VITE_APP_URL}
    container_name: tallerapp-nginx

    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - storage:/var/www/html/storage:ro

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    logging: *default-logging

    depends_on:
      app:
        condition: service_started

    networks:
      - tallerapp


  # ==========================================================
  # Laravel Queue
  # ==========================================================

  queue:
    image: tallerapp-app:${APP_VERSION}

    container_name: tallerapp-queue

    restart: unless-stopped

    working_dir: /var/www/html

    env_file:
      - .env

    # Tiempo de gracia para terminar jobs en curso antes de SIGKILL
    stop_grace_period: 60s

    command:
      php artisan queue:work
      --sleep=3
      --tries=3
      --timeout=90
      --max-time=3600

    volumes:
      - storage:/var/www/html/storage

    logging: *default-logging

    depends_on:
      mysql:
        condition: service_healthy

      redis:
        condition: service_healthy

    networks:
      - tallerapp


  # ==========================================================
  # Laravel Scheduler
  # ==========================================================

  scheduler:
    image: tallerapp-app:${APP_VERSION}

    container_name: tallerapp-scheduler

    restart: unless-stopped

    working_dir: /var/www/html

    env_file:
      - .env

    command:
      php artisan schedule:work

    volumes:
      - storage:/var/www/html/storage

    logging: *default-logging

    depends_on:
      mysql:
        condition: service_healthy

      redis:
        condition: service_healthy

    networks:
      - tallerapp


  # ==========================================================
  # Laravel migrations / one-shot commands
  # ==========================================================

  migrate:
    image: tallerapp-app:${APP_VERSION}

    container_name: tallerapp-migrate

    working_dir: /var/www/html

    env_file:
      - .env

    command:
      php artisan migrate --force

    volumes:
      - storage:/var/www/html/storage

    logging: *default-logging

    depends_on:
      mysql:
        condition: service_healthy

      redis:
        condition: service_healthy

    networks:
      - tallerapp


  # ==========================================================
  # MySQL
  # ==========================================================

  mysql:
    image: mysql:8.0

    container_name: tallerapp-mysql

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}

    volumes:
      - mysql_data:/var/lib/mysql

    logging: *default-logging

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"
        ]

      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    networks:
      - tallerapp


  # ==========================================================
  # Redis
  # ==========================================================

  redis:
    image: redis:7-alpine

    container_name: tallerapp-redis

    restart: unless-stopped

    command:
      redis-server --appendonly yes

    volumes:
      - redis_data:/data

    logging: *default-logging

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]

      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - tallerapp


# ============================================================
# Volumes
# ============================================================

volumes:

  mysql_data:

  redis_data:

  storage:


# ============================================================
# Network
# ============================================================

networks:

  tallerapp:
    driver: bridge